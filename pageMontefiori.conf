server {
    listen 80;  listen [::]:80;
    server_name ww3.montefiori.com.pe;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;  listen [::]:443 ssl http2;
    server_name ww3.montefiori.com.pe;

    ssl_certificate /etc/nginx/certs/montefiori.com/star_montefiori_com_pe.crt;
    ssl_certificate_key /etc/nginx/certs/montefiori.com/montefiori2024.key;
    ssl_trusted_certificate /etc/nginx/certs/montefiori.com/DigiCertCA.crt;

    location / {
        proxy_pass         http://127.0.0.1:8084;
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  https;
        proxy_redirect     off;
    }
}

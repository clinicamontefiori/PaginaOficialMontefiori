services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_apache
    restart: always
    ports:
      - "8084:80"
    environment:
      APP_ENV: production
      TZ: America/Lima
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appmontefiori_network

  db:
    image: mysql:8.0
    container_name: app_mysql
    restart: always
    environment:
      MYSQL_DATABASE: "montefioridb_prod"
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_USER: "montefiori_user"
      MYSQL_PASSWORD: ""
      TZ: America/Lima
    volumes:
      - db_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p'' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appmontefiori_network

volumes:
  db_data:

networks:
  appmontefiori_network:
    driver: bridge